<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>至未來更好的我們 | Vision Board 2026</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.2s both; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .backface-hidden { backface-visibility: hidden; }
    </style>
</head>
<body class="bg-[#FFFBFB] text-[#475569] font-sans selection:bg-rose-100">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ==========================================
        // 請在此填入你從 Firebase 控制台取得的配置
        // ==========================================
        const firebaseConfig = {
            apiKey: "你的_API_KEY",
            authDomain: "你的_PROJECT_ID.firebaseapp.com",
            projectId: "你的_PROJECT_ID",
            storageBucket: "你的_PROJECT_ID.appspot.com",
            messagingSenderId: "你的_SENDER_ID",
            appId: "你的_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'vision-board-2026';

        // 將 Firebase 實例掛載到 window，讓 React 腳本可以使用
        window.fb = { db, auth, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, increment, signInAnonymously, onAuthStateChanged };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            Plus, Link: LinkIcon, Mail, Heart, Cloud, Loader2, Trash2, X, 
            RotateCw, Image: ImageIcon, Upload, AlertCircle, Sparkles, BookOpen 
        } = lucide;

        // 圖片元件
        const SmartImage = ({ src, alt, className }) => {
            const [status, setStatus] = useState('loading'); 
            useEffect(() => { setStatus('loading'); }, [src]);
            return (
                <div className={`relative overflow-hidden ${className}`}>
                    {status === 'loading' && (
                        <div className="absolute inset-0 bg-slate-100 animate-pulse flex items-center justify-center">
                            <ImageIcon className="text-slate-200" size={24} />
                        </div>
                    )}
                    <img 
                        src={src || 'https://images.unsplash.com/photo-1579546678181-7f31169c7973'} 
                        alt={alt}
                        className={`w-full h-full object-cover transition-opacity duration-500 ${status === 'success' ? 'opacity-100' : 'opacity-0'}`}
                        onLoad={() => setStatus('success')}
                        onError={() => setStatus('error')}
                    />
                </div>
            );
        };

        const App = () => {
            const [items, setItems] = useState([]);
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [isAuthorized, setIsAuthorized] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [passError, setPassError] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [activeTab, setActiveTab] = useState('all');
            const [newType, setNewType] = useState('image');
            const [inputContent, setInputContent] = useState('');
            const [inputDescription, setInputDescription] = useState('');
            const [inputTitle, setInputTitle] = useState('');
            const [inputImage, setInputImage] = useState('');
            const [inputDate, setInputDate] = useState('');
            const [inputAuthor, setInputAuthor] = useState(localStorage.getItem('vision_author') || '');
            const [flippedId, setFlippedId] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            const fileInputRef = useRef(null);

            // 確保 Firebase 已在 window 上
            useEffect(() => {
                const checkFB = setInterval(() => {
                    if (window.fb) {
                        clearInterval(checkFB);
                        const { auth, signInAnonymously, onAuthStateChanged, db, collection, onSnapshot } = window.fb;
                        
                        signInAnonymously(auth).catch(console.error);
                        onAuthStateChanged(auth, (u) => setUser(u));
                    }
                }, 100);
            }, []);

            // 監聽數據
            useEffect(() => {
                if (!user || !window.fb) return;
                const { db, collection, onSnapshot } = window.fb;
                const colRef = collection(db, 'artifacts', 'vision-board-2026', 'public', 'data', 'visions');
                
                const unsubscribe = onSnapshot(colRef, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setItems(data.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)));
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [user]);

            const handleAddItem = async () => {
                const { db, collection, addDoc } = window.fb;
                if (inputAuthor) localStorage.setItem('vision_author', inputAuthor);
                
                const newItem = {
                    type: newType,
                    content: inputContent.trim(),
                    description: inputDescription,
                    title: inputTitle || '未命名',
                    coverImage: newType === 'postcard' ? (inputImage || 'https://images.unsplash.com/photo-1579546678181-7f31169c7973') : null,
                    category: newType === 'postcard' ? '未來' : (newType === 'link' ? '資源' : '夢想'),
                    likes: 0,
                    authorName: inputAuthor || '匿名者',
                    deliveryDate: inputDate || new Date().toISOString().split('T')[0],
                    createdAt: Date.now()
                };

                await addDoc(collection(db, 'artifacts', 'vision-board-2026', 'public', 'data', 'visions'), newItem);
                setIsModalOpen(false);
                resetForm();
            };

            const resetForm = () => {
                setInputContent(''); setInputDescription(''); setInputTitle('');
                setInputImage(''); setInputDate('');
            };

            const handlePassSubmit = (e) => {
                e.preventDefault();
                if (passwordInput === '2026') setIsAuthorized(true);
                else setPassError(true);
            };

            // ... (其餘渲染邏輯保持不變，但將 Lucide 圖標改為大寫調用) ...
            
            if (loading) return <div className="min-h-screen flex items-center justify-center"><Loader2 className="animate-spin text-indigo-400" /></div>;

            return (
                <div className="min-h-screen relative">
                    {/* 這裡粘貼你原始代碼中 <header>, <main>, <footer> 的所有內容 */}
                    {/* 注意：在 JSX 中所有的 class 要維持不變 */}
                    {/* 下方僅示意關鍵區塊 */}
                    <div className={`${!isAuthorized ? 'blur-lg pointer-events-none' : ''}`}>
                         <header className="bg-white/60 backdrop-blur-xl border-b pt-8 pb-6 text-center">
                            <h1 className="text-[11px] font-bold tracking-[1em] uppercase">至未來更好的我們</h1>
                            <div className="flex justify-center gap-3 mt-8">
                                <button onClick={() => {setNewType('image'); setIsModalOpen(true)}} className="bg-[#FEFCE8] p-3 rounded-2xl text-[9px] font-black">VISIONS</button>
                                <button onClick={() => {setNewType('link'); setIsModalOpen(true)}} className="bg-[#FFF1F2] p-3 rounded-2xl text-[9px] font-black">LINKS</button>
                                <button onClick={() => {setNewType('postcard'); setIsModalOpen(true)}} className="bg-[#F5F3FF] p-3 rounded-2xl text-[9px] font-black">LETTERS</button>
                            </div>
                         </header>

                         <main className="max-w-7xl mx-auto px-6 py-10">
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                {items.filter(i => activeTab === 'all' || i.type === activeTab).map(item => (
                                    <div key={item.id} className="aspect-[4/5] perspective-1000" onClick={() => setFlippedId(flippedId === item.id ? null : item.id)}>
                                        <div className={`relative w-full h-full transition-transform duration-700 transform-style-3d ${flippedId === item.id ? 'rotate-y-180' : ''}`}>
                                            {/* 正面 */}
                                            <div className="absolute inset-0 backface-hidden bg-white rounded-[2rem] shadow-sm overflow-hidden border border-rose-50 flex flex-col">
                                                {item.type === 'image' && <SmartImage src={item.content} className="flex-1" />}
                                                {item.type === 'link' && <div className="flex-1 flex items-center justify-center bg-indigo-50"><LinkIcon /></div>}
                                                {item.type === 'postcard' && <SmartImage src={item.coverImage} className="flex-1" />}
                                                <div className="p-4 flex justify-between items-center">
                                                    <div>
                                                        <p className="text-xs font-bold">{item.title}</p>
                                                        <p className="text-[8px] text-slate-300 uppercase">By {item.authorName}</p>
                                                    </div>
                                                </div>
                                            </div>
                                            {/* 背面 */}
                                            <div className="absolute inset-0 backface-hidden rotate-y-180 bg-white rounded-[2rem] shadow-xl p-6 border border-rose-100 flex flex-col">
                                                <p className="text-sm italic font-serif text-slate-600">{item.description || item.content}</p>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                         </main>
                    </div>

                    {!isAuthorized && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-white/20 backdrop-blur-md">
                            <form onSubmit={handlePassSubmit} className="bg-white p-12 rounded-[3.5rem] shadow-xl text-center">
                                <h2 className="text-[9px] font-black tracking-[1.2em] mb-8">ACCESS</h2>
                                <input type="password" value={passwordInput} onChange={e => setPasswordInput(e.target.value)} placeholder="CODE" className="border p-4 rounded-2xl text-center tracking-widest outline-none" />
                                <button type="submit" className="block w-full mt-4 bg-slate-800 text-white p-4 rounded-2xl text-[9px]">UNLOCK</button>
                            </form>
                        </div>
                    )}

                    {isModalOpen && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/10 backdrop-blur-sm">
                            <div className="bg-white rounded-[2.5rem] p-8 max-w-md w-full">
                                <input value={inputAuthor} onChange={e => setInputAuthor(e.target.value)} placeholder="署名" className="w-full mb-4 p-3 bg-slate-50 rounded-xl" />
                                <input value={inputTitle} onChange={e => setInputTitle(e.target.value)} placeholder="標題" className="w-full mb-4 p-3 bg-slate-50 rounded-xl" />
                                <textarea value={inputContent} onChange={e => setInputContent(e.target.value)} placeholder="內容" className="w-full mb-4 p-3 bg-slate-50 rounded-xl" rows="4" />
                                <button onClick={handleAddItem} className="w-full bg-slate-900 text-white p-4 rounded-xl font-bold">發布</button>
                                <button onClick={() => setIsModalOpen(false)} className="w-full mt-2 text-slate-400 text-xs">取消</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
